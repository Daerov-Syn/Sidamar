<script>
const map = document.querySelector('#plan');
const viewport = document.querySelector('#viewport');
const destination = document.querySelector('#destination');
const points = new Map();
for(const group of map.querySelectorAll('.place')){
 const id=Number(group.dataset.id);
 points.set(id,group);
 group.addEventListener('click',()=>selectPoint(id));
 group.addEventListener('keydown',event=>{
   if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPoint(id);}
 });
}
for(const id of [...points.keys()].sort((a,b)=>a-b)){
 destination.add(new Option(points.get(id).getAttribute('aria-label'),id));
}
const baseWidth = 2050;
function setWidth(width){
 map.style.width=Math.max(viewport.clientWidth,Math.min(3200,width))+'px';
}
function centerPoint(point){
 const a=point.getBoundingClientRect(), b=viewport.getBoundingClientRect();
 viewport.scrollBy({left:a.left+a.width/2-b.left-b.width/2,top:a.top+a.height/2-b.top-b.height/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}
function selectPoint(id){
 const point=points.get(Number(id));
 if(!point){overview();return;}
 for(const node of points.values()) node.classList.toggle('selected',node===point);
 destination.value=id;
 setWidth(Math.max(baseWidth,map.clientWidth));
 centerPoint(point);
}
function overview(){
 destination.value='';
 for(const node of points.values()) node.classList.remove('selected');
 map.style.width='100%';
 viewport.scrollTo(0,0);
}
destination.onchange=()=>selectPoint(destination.value);
document.querySelector('#reset').onclick=overview;
for(const [id,factor] of [['larger',1.4],['smaller',1/1.4]]){
 document.getElementById(id).onclick=()=>{
   setWidth(map.clientWidth*factor);
   if(destination.value) centerPoint(points.get(Number(destination.value)));
 };
}
function openLocation(){
 const id=Number(location.hash.slice(1));
 if(points.has(id)) selectPoint(id);
}
overview();
openLocation();
window.addEventListener('hashchange',openLocation);
</script>
